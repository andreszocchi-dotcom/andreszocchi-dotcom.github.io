<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.author | escape }} — home">{{ site.author | escape }}<span aria-hidden="true">.</span></a>
      {% include navigation.html %}
    </header>
    <main id="main-content" class="site-main" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
